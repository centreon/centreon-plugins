[package]
name = "centreon-plugin-notification-email"
version = "1.0.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
lettre = { version = ">=0.11.22, <0.12", default-features = false, features = [
  "smtp-transport",
  "builder",
  "rustls-tls",
  "hostname",
] }
ureq = { version = "2", default-features = false, features = ["rustls"] }
serde_json = "1.0.151"
urlencoding = "2.1.3"
snafu = "0.9.2"
log = "0.4.33"
env_logger = "0.11.11"
