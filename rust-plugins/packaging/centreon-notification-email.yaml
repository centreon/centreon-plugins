name: "centreon-plugin-notification-email-rs"
arch: "${ARCH}"
platform: "linux"
version_schema: "none"
version: "${VERSION}"
release: "${RELEASE}${DIST}"
section: "default"
priority: "optional"
maintainer: "Centreon <contact@centreon.com>"
description: |
  Centreon Rust Email Notification Plugin sends Centreon host/service/BAM/meta-service
  alert emails over SMTP, with an optional inline performance graph.
vendor: "Centreon"
homepage: "https://www.centreon.com"
license: "Apache-2.0"

contents:
  - src: "../target/release/centreon-plugin-notification-email"
    dst: "/usr/lib/centreon/plugins/"
    expand: true
    file_info:
      mode: 0755
      owner: "root"
      group: "root"

rpm:
  summary: Centreon Rust Email Notification Plugin
  signature:
    key_file: ${RPM_SIGNING_KEY_FILE}
    key_id: ${RPM_SIGNING_KEY_ID}
